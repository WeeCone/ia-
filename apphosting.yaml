# Firebase App Hosting — https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 10

env:
  # Config web Firebase du projet « scanzivo » (publique par nature : elle est incluse dans le code du site).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCw23KxJdB4MjDG_vps9xFBIGZb5YIoZus
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: scanzivo.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: scanzivo
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: scanzivo.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 190863139139
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:190863139139:web:b00ca34632e08b7e104ff6
    availability: [BUILD, RUNTIME]

  # --- Paiement (Stripe, mode test) ----------------------------------------------------
  # URL publique de l'app, pour les redirections Stripe (sinon : l'adresse de la requête).
  - variable: APP_URL
    value: https://scanvizo--scanzivo.europe-west4.hosted.app
    availability: [RUNTIME]
  - variable: STRIPE_PRICE_MONTHLY
    value: price_1UPRavAeyb88TK1kfidsAU3j # LIVE (mode réel) — à remplacer par le prix de test pendant les essais
    availability: [RUNTIME]
  - variable: STRIPE_PRICE_LIFETIME
    value: price_1UPRZYAeyb88TK1ksRQteZMb # LIVE (mode réel) — à remplacer par le prix de test pendant les essais
    availability: [RUNTIME]

  # Secrets (Cloud Secret Manager) : firebase apphosting:secrets:set <nom>
  - variable: ANTHROPIC_API_KEY
    secret: anthropicApiKey
    availability: [RUNTIME]
  - variable: STRIPE_SECRET_KEY
    secret: stripeSecretKey
    availability: [RUNTIME]
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripeWebhookSecret
    availability: [RUNTIME]
  # À réactiver avec Resend (email de bienvenue) :
  # - variable: RESEND_API_KEY
  #   secret: resendApiKey
  #   availability: [RUNTIME]
  # - variable: EMAIL_FROM
  #   value: "Scanzivo <bonjour@REMPLACER>"
  #   availability: [RUNTIME]
  # FIREBASE_SERVICE_ACCOUNT est inutile ici : le SDK Admin utilise les identifiants par défaut.
